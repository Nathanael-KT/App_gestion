name: Build & Deploy with Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Detect and apply new migrations
        env:
          env:
          SUPABASE_DB_URL: postgresql://postgres.${{ secrets.SUPABASE_PROJECT_ID }}:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-eu-west-1.pooler.supabase.com:6543/postgres

        run: |
          set -euo pipefail

          echo "🔍 Checking for new migration files..."

          BEFORE_SHA="${{ github.event.before }}"
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep "^supabase/migrations/.*\.sql$" > changed_migrations.txt || true
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep "^supabase/migrations/.*\.sql$" > changed_migrations.txt || true
          fi

          if [ -s changed_migrations.txt ]; then
            echo "📦 Migration files detected:"
            cat changed_migrations.txt

            echo "🔌 Testing database connection..."
            if ! psql "$SUPABASE_DB_URL" -c "SELECT 1" > /dev/null 2>&1; then
              echo "❌ Cannot connect to database. Please check SUPABASE_DB_URL secret."
              exit 1
            fi
            echo "✅ Database connection successful"

            echo "🚀 Applying migrations..."
            
            for migration_file in $(cat changed_migrations.txt | sort); do
              echo "  📝 Applying: $migration_file"
              if psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$migration_file"; then
                echo "  ✅ Success: $migration_file"
              else
                echo "  ❌ Failed: $migration_file"
                exit 1
              fi
            done
            
            echo "🎉 Migration processing completed successfully"
          else
            echo "ℹ️ No migration files found"
            echo "Skipping migration step"
          fi

          rm -f changed_migrations.txt

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, migrate]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Pull Vercel Environment
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel Artifacts
        run: pnpm dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Show Docker deployment info
        run: |
          echo "🐳 Docker image also available:"
          echo "Registry: ${{ env.REGISTRY }}"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "To deploy with Docker:"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "docker run -d --name app-gestion -p 3000:3000 \\"
          echo "  -e SUPABASE_URL=${{ secrets.SUPABASE_URL }} \\"
          echo "  -e SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \\"
          echo "  --restart unless-stopped \\"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🎉 Deployment successful!"
            echo "🌐 Application live: https://app-gestion.vercel.app"
            echo "🐳 Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
            echo "📱 URL Vercel disponible dans le dashboard du projet"
            echo ""
            echo "✅ Summary:"
            echo "  - Tests passed"
            echo "  - Migrations applied"
            echo "  - Docker image built and pushed"
            echo "  - Deployed to Vercel"
          else
            echo "❌ Deployment failed!"
            echo "🔍 Check the workflow logs for details"
            echo ""
            echo "📋 Check these jobs:"
            if [ "${{ needs.migrate.result }}" != "success" ]; then
              echo "  - Database Migration failed"
            fi
            if [ "${{ needs.build.result }}" != "success" ]; then
              echo "  - Docker Build failed"
            fi
            if [ "${{ needs.deploy.result }}" != "success" ]; then
              echo "  - Vercel Deploy failed"
            fi
          fi